server {
    listen 80;
    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # React Router jaisi client-side routing ke liye — koi bhi unknown
    # path index.html pe bhej do, taaki page refresh karne pe 404 na aaye.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend tak forward karo — frontend ko backend ka asli address
    # kabhi pata hone ki zarurat nahi, sab same-origin dikhta hai.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }
}