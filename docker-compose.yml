services:
  backend:
    build:
      context: .
      args:
        INSTALL_DOCKER_CLI: "0"
    env_file: .env
    volumes:
      - ./backend/database:/app/backend/database
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped